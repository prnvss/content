// ============================================================
//  Apex Legends autoexec.cfg
//  Target: RTX 5070 Ti / Ryzen 5 7600X / 32GB DDR5 / 5120x1440
//  Goal:   stable frametimes at FOV 120 (cl_fovScale 1.7)
//
//  Install: <Apex Legends install folder>\cfg\autoexec.cfg
//  Launch options (Steam/EA):  +exec autoexec -novid -high -forcenovsync -fullscreen
//
//  Apex silently ignores cvars Respawn has removed, so nothing
//  here can break the game. Only the lines marked [core] are
//  the ones that matter for FPS stability.
// ============================================================

// ---- [core] frame cap ------------------------------------------------
// A fixed cap is the single biggest stability win. Pick a number your
// 1% lows stay ABOVE in a fight, not your average. 189 is the safe
// start for this rig at 5120x1440 / FOV 120 with the videoconfig.txt
// in this folder. Adjust after testing with cl_showfps 4:
//   240 Hz panel, G-Sync on  -> fps_max 225
//   144 Hz panel, G-Sync on  -> fps_max 141
//   120 Hz panel, G-Sync on  -> fps_max 117
//   no G-Sync                -> leave 189, or raise until lows dip
fps_max "189"
fps_max_use_refresh "0"

// ---- [core] keep the wide FOV you chose --------------------------------
// The in-game slider tops out at 1.55 (110). Re-applying it here stops
// the menu from clamping it back if the video settings screen is opened.
cl_fovScale "1.7"

// ---- rendering / threading ---------------------------------------------
mat_queue_mode "2"            // multi-threaded material system
cl_forcepreload "1"           // preload assets on map load instead of mid-fight
r_fastzreject "1"

// ---- reduce per-frame CPU work ----------------------------------------
cl_ragdoll_collide "0"
cl_ragdoll_self_collision "0"
func_break_max_pieces "0"     // no debris chunks from breakables
cl_particle_fallback_base "3"
cl_particle_fallback_multiplier "2"

// ---- input (no FPS effect, keeps mouse consistent) --------------------
m_rawinput "1"
m_acceleration "0"

// ---- diagnostics: turn on while tuning fps_max, off when happy --------
cl_showfps "0"                // set to 4 to see fps + frametime in a fight
cl_showpos "0"

// ---- feedback so you know it ran --------------------------------------
echo "=== autoexec.cfg loaded: fps_max 189, FOV 1.7 ==="
